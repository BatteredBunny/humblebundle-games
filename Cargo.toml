[package]
name = "humblebundle-games"
version = "0.4.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
reqwest = { version = "0.13.5", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
